<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 캘린더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a single phone-width app column with bottom tab bar; two people = two hues, overlap = their blend */
:root{
  --bg:#eef1f6; --surface:#ffffff; --fg:#1d2433; --muted:#6b7488; --line:#dde2ec;
  --me:#1f7a8c; --me-soft:#dcf0f3; --you:#c2416b; --you-soft:#f8e1e9; --both:#6d4fb3; --both-soft:#ece6f8;
  --free:#2f9e44;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b2029; --fg:#e8ebf2; --muted:#9aa3b5; --line:#2b3240;
  --me:#4fb3c6; --me-soft:#173a42; --you:#e9779c; --you-soft:#45202e; --both:#a78bea; --both-soft:#2e2647; --free:#5cc46f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b2029; --fg:#e8ebf2; --muted:#9aa3b5; --line:#2b3240;
  --me:#4fb3c6; --me-soft:#173a42; --you:#e9779c; --you-soft:#45202e; --both:#a78bea; --both-soft:#2e2647; --free:#5cc46f; color-scheme:dark}
html,body{height:100%} body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.app{max-width:400px;margin:0 auto;background:var(--surface);border-radius:28px;border:1px solid var(--line);
  overflow:hidden;display:flex;flex-direction:column;min-height:720px}
header{padding:20px 20px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.pair{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.av.me{background:var(--me)} .av.you{background:var(--you);margin-left:-10px;border:2px solid var(--surface)}
main{flex:1;padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
nav button{background:none;border:0;padding:12px 0 14px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button[aria-current="true"]{color:var(--fg);font-weight:700}
nav svg{width:22px;height:22px}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--both);outline-offset:2px}

.month{display:flex;justify-content:space-between;align-items:center}
.month b{font-family:var(--display);font-weight:400;font-size:22px}
.month button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wd{font-size:11px;color:var(--muted);padding:4px 0;letter-spacing:.04em}
.wd:first-child{color:var(--you)}
.day{background:none;border:0;color:var(--fg);font:inherit;font-size:14px;aspect-ratio:1/1.1;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-variant-numeric:tabular-nums;position:relative}
.day.out{visibility:hidden}
.day.sel{background:var(--both-soft)}
.day.today span:first-child{background:var(--fg);color:var(--surface);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.day.free::after{content:"";position:absolute;inset:3px;border:1.5px dashed var(--free);border-radius:10px;pointer-events:none}
.dots{display:flex;gap:3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend .fb{width:12px;height:12px;border:1.5px dashed var(--free);border-radius:4px}
.list{display:flex;flex-direction:column;gap:8px}
.list h2{font-size:14px;margin:4px 0 0;color:var(--muted);font-weight:500}
.ev{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px}
.ev.me{background:var(--me-soft)} .ev.you{background:var(--you-soft)} .ev.both{background:var(--both-soft)}
.ev time{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.ev .who{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff}
.who.me{background:var(--me)} .who.you{background:var(--you)} .who.both{background:var(--both)}
.empty{color:var(--muted);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:14px;text-align:center}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font:inherit;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700}
.drop{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--muted)}
.drop strong{color:var(--fg)}
.drop img{border-radius:12px;max-height:200px;object-fit:contain}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.sample{background:none;border:0;color:var(--both);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;align-self:center}
.cta{background:var(--fg);color:var(--surface);border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;cursor:pointer}
.cta:disabled{opacity:.4;cursor:default}
.parsed{display:flex;flex-direction:column;gap:6px}
.parsed label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px}
.parsed small{display:block;color:var(--muted);font-size:12px}
.note{font-size:12px;color:var(--muted);line-height:1.6;background:var(--bg);border-radius:12px;padding:10px 12px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--both);border-radius:50%;animation:s .8s linear infinite;margin:auto}
@keyframes s{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px}

.card{border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.code{font-family:var(--display);font-size:34px;letter-spacing:.18em;text-align:center}
.status{display:flex;align-items:center;gap:10px}
.status .av{width:40px;height:40px;font-size:15px;margin:0;border:0}
.ok{color:var(--free);font-size:13px;font-weight:700}
.flow{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5}
</style>

<div class="app">
  <header>
    <h1>우리 캘린더</h1>
    <div class="pair"><span class="av me">민</span><span class="av you">서</span><span>D+412</span></div>
  </header>
  <main id="view"></main>
  <nav>
    <button data-tab="cal" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>캘린더</button>
    <button data-tab="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>사진으로 추가</button>
    <button data-tab="link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>연결</button>
  </nav>
</div>

<script>
// 예시 데이터 (실제 앱에서는 서버의 커플 공유 캘린더)
const NAME = {me:"민준", you:"서연", both:"함께"};
let events = [
  {d:"2026-11-03", t:"09:00", title:"팀 회의", who:"me"},
  {d:"2026-11-04", t:"14:00", title:"치과", who:"you"},
  {d:"2026-11-04", t:"19:30", title:"저녁 데이트", who:"both"},
  {d:"2026-11-06", t:"10:00", title:"요가", who:"you"},
  {d:"2026-11-10", t:"13:00", title:"거래처 미팅", who:"me"},
  {d:"2026-11-12", t:"18:00", title:"야근", who:"me"},
  {d:"2026-11-12", t:"20:00", title:"친구 모임", who:"you"},
  {d:"2026-11-14", t:"15:00", title:"전시회", who:"both"},
  {d:"2026-11-17", t:"11:00", title:"출장", who:"me"},
  {d:"2026-11-19", t:"16:00", title:"스터디", who:"you"},
  {d:"2026-11-24", t:"09:00", title:"건강검진", who:"you"},
  {d:"2026-11-26", t:"19:00", title:"회식", who:"me"},
];
// 사진 분석 결과 예시 (실제 앱: 이미지 → 비전 AI → 날짜/시간/제목 JSON)
const SAMPLE_PARSE = {
  me:[{d:"2026-11-18",t:"10:00",title:"분기 보고"},{d:"2026-11-20",t:"14:00",title:"교육"},{d:"2026-11-27",t:"09:30",title:"외근"}],
  you:[{d:"2026-11-09",t:"13:00",title:"수업 보강"},{d:"2026-11-21",t:"11:00",title:"미용실"},{d:"2026-11-28",t:"18:00",title:"동창회"}],
};
const TODAY = "2026-11-04";
let ym = [2026,10], sel = TODAY, filter = "all", tab = "cal";
let up = {who:"me", img:null, state:"idle", rows:[]};

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const key = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const visible = e => filter==="all" || e.who===filter || e.who==="both";
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function cal(){
  const [y,m] = ym, first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  let cells = "";
  for(let i=0;i<first;i++) cells += `<span class="day out"></span>`;
  for(let d=1; d<=days; d++){
    const k = key(y,m,d), es = events.filter(e=>e.d===k && visible(e));
    const whos = [...new Set(events.filter(e=>e.d===k).map(e=>e.who))];
    const free = !whos.length;
    cells += `<button class="day${k===sel?" sel":""}${k===TODAY?" today":""}${free?" free":""}" data-d="${k}" aria-label="${m+1}월 ${d}일 일정 ${es.length}개">
      <span>${d}</span><span class="dots">${[...new Set(es.map(e=>e.who))].map(w=>`<i class="dot" style="background:var(--${w})"></i>`).join("")}</span></button>`;
  }
  const list = events.filter(e=>e.d===sel && visible(e)).sort((a,b)=>a.t.localeCompare(b.t));
  const [,sm,sd] = sel.split("-").map(Number);
  $("#view").innerHTML = `
    <div class="month"><button data-mv="-1" aria-label="이전 달">‹</button><b>${y}년 ${m+1}월</b><button data-mv="1" aria-label="다음 달">›</button></div>
    <div class="chips">${[["all","모두"],["me",NAME.me],["you",NAME.you]].map(([v,l])=>
      `<button class="chip" data-f="${v}" aria-pressed="${filter===v}">${v!=="all"?`<i class="dot" style="background:var(--${v})"></i>`:""}${l}</button>`).join("")}</div>
    <div class="grid">${"일월화수목금토".split("").map(w=>`<span class="wd">${w}</span>`).join("")}${cells}</div>
    <div class="legend"><span><i class="dot" style="background:var(--me)"></i>${NAME.me}</span><span><i class="dot" style="background:var(--you)"></i>${NAME.you}</span><span><i class="dot" style="background:var(--both)"></i>함께</span><span><i class="fb"></i>둘 다 비는 날</span></div>
    <div class="list"><h2>${sm}월 ${sd}일</h2>${list.length? list.map(e=>`
      <div class="ev ${e.who}"><time>${e.t}</time><span>${esc(e.title)}</span><span class="who ${e.who}">${NAME[e.who]}</span></div>`).join("")
      : `<div class="empty">둘 다 일정이 없어요. 데이트 잡기 좋은 날이에요.</div>`}</div>`;
}

function upload(){
  const p = up.who==="me"?NAME.me:NAME.you;
  let body = "";
  if(up.state==="idle") body = `<button class="cta" id="go" ${up.img?"":"disabled"}>일정 읽어오기</button>`;
  if(up.state==="busy") body = `<div class="spin" role="status" aria-label="분석 중"></div><p class="note" style="text-align:center">사진에서 날짜와 일정을 찾고 있어요…</p>`;
  if(up.state==="done") body = `
    <p style="margin:0;font-weight:700">${up.rows.length}개 일정을 찾았어요. 추가할 것만 골라 주세요.</p>
    <div class="parsed">${up.rows.map((r,i)=>`<label><input type="checkbox" id="r${i}" data-i="${i}" checked><span>${esc(r.title)}<small>${r.d.slice(5).replace("-","월 ")}일 · ${r.t}</small></span></label>`).join("")}</div>
    <button class="cta" id="add">${p} 캘린더에 추가</button>`;
  $("#view").innerHTML = `
    <div><p style="margin:0 0 8px;font-weight:700">누구의 일정인가요?</p>
    <div class="seg">${["me","you"].map(w=>`<button data-who="${w}" aria-pressed="${up.who===w}">${NAME[w]}</button>`).join("")}</div></div>
    <label class="drop" for="file">${up.img?`<img src="${up.img}" alt="올린 일정 사진">`:`<strong>일정표 사진 올리기</strong><span>근무표, 시간표, 다이어리, 캡처 화면 모두 가능</span>`}
      <input type="file" id="file" accept="image/*"></label>
    ${up.img?"":`<button class="sample" id="sample">예시 사진으로 해보기</button>`}
    ${body}
    <p class="note">사진은 일정 추출에만 쓰고 저장하지 않아요. 읽은 결과는 추가 전에 직접 확인하고 고칠 수 있어요.</p>`;
}

function link(){
  $("#view").innerHTML = `
    <div class="card"><div class="status"><span class="av me">민</span><span class="av you">서</span>
      <div><b>${NAME.me} ♥ ${NAME.you}</b><div class="ok">연결됨 · 2025년 9월 18일부터</div></div></div></div>
    <div class="card"><b>새로 연결하기</b><span class="note">상대가 앱에서 아래 코드를 입력하면 두 캘린더가 하나로 합쳐져요.</span>
      <div class="code" id="code">K7Q-24M</div><button class="cta" id="copy">코드 복사</button></div>
    <div class="card"><b>앱 흐름</b><ol class="flow">
      <li>가입 후 초대 코드로 상대와 연결</li>
      <li>각자 일정표 사진을 찍어 올림</li>
      <li>AI가 날짜·시간·제목을 읽어 목록으로 보여줌</li>
      <li>확인 후 추가하면 둘의 캘린더에 바로 반영</li>
      <li>색으로 누구 일정인지 구분, 둘 다 비는 날 자동 표시</li></ol></div>`;
}

const render = () => ({cal,up:upload,link})[tab]();
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.role="status"; el.textContent=t; document.body.append(el); setTimeout(()=>el.remove(),2000); }

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; document.querySelectorAll("nav button").forEach(n=>n.setAttribute("aria-current", n===b)); render(); }
  else if(b.dataset.d){ sel=b.dataset.d; cal(); }
  else if(b.dataset.mv){ ym[1]+=+b.dataset.mv; if(ym[1]<0){ym[0]--;ym[1]=11} if(ym[1]>11){ym[0]++;ym[1]=0} cal(); }
  else if(b.dataset.f){ filter=b.dataset.f; cal(); }
  else if(b.dataset.who){ up={who:b.dataset.who,img:up.img,state:"idle",rows:[]}; upload(); }
  else if(b.id==="sample"){ up.img=sampleImg(); upload(); }
  else if(b.id==="go"){ up.state="busy"; upload(); setTimeout(()=>{ up.rows=SAMPLE_PARSE[up.who].map(r=>({...r})); up.state="done"; upload(); },1400); }
  else if(b.id==="add"){
    const picked = up.rows.filter((r,i)=>$("#r"+i).checked);
    events.push(...picked.map(r=>({...r, who:up.who})));
    toast(`${picked.length}개 일정을 추가했어요`); up={who:up.who,img:null,state:"idle",rows:[]};
    tab="cal"; sel=picked[0]?.d||sel; document.querySelectorAll("nav button").forEach(n=>n.setAttribute("aria-current", n.dataset.tab==="cal")); cal();
  }
  else if(b.id==="copy"){ navigator.clipboard?.writeText("K7Q-24M").then(()=>toast("복사했어요"),()=>getSelection().selectAllChildren($("#code"))); }
});
document.addEventListener("change", e=>{
  if(e.target.id!=="file" || !e.target.files[0]) return;
  const r = new FileReader(); r.onload = () => { up.img=r.result; up.state="idle"; upload(); }; r.readAsDataURL(e.target.files[0]);
});

// 예시용 '근무표 사진'을 캔버스로 그림
function sampleImg(){
  const c=document.createElement("canvas"); c.width=600; c.height=380; const x=c.getContext("2d");
  x.fillStyle="#fbfbf7"; x.fillRect(0,0,600,380); x.fillStyle="#222"; x.font="bold 26px sans-serif"; x.fillText("11월 일정표",24,44);
  x.strokeStyle="#bbb"; x.font="20px sans-serif";
  SAMPLE_PARSE[up.who].forEach((r,i)=>{ const yy=100+i*80; x.strokeRect(24,yy-34,552,60);
    x.fillText(r.d.slice(5).replace("-","/"),40,yy+4); x.fillText(r.t,150,yy+4); x.fillText(r.title,260,yy+4); });
  return c.toDataURL();
}
render();
</script>
