<h1>우리 캘린더 계정 삭제</h1>

<h2>앱에서 삭제하기</h2>
<ol>
<li>우리 캘린더 앱을 열고 로그인합니다.</li>
<li>아래 탭의 <b>연결·계정</b>을 누릅니다.</li>
<li><b>회원 탈퇴</b> → <b>탈퇴하고 모든 데이터 지우기</b>를 누릅니다.</li>
</ol>

<h2>앱 없이 삭제 요청하기</h2>
<p>[문의 이메일] 로 로그인에 쓴 계정(카카오·Google·Apple)과 함께 삭제를 요청해 주세요. 확인 후 7일 안에 처리합니다.</p>

<h2>삭제되는 정보</h2>
<p>계정 정보(이름, 이메일), 커플 연결 정보, 등록한 모든 일정이 즉시 삭제되며 복구할 수 없습니다. 따로 보관하는 정보는 없습니다.</p>
