<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a8c">
<title>우리 캘린더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-width app column with bottom tab bar; fills the screen on phones. Two people = two hues, overlap = their blend */
:root{
  --bg:#eef1f6; --surface:#ffffff; --fg:#1d2433; --muted:#6b7488; --line:#dde2ec;
  --me:#1f7a8c; --me-soft:#dcf0f3; --you:#c2416b; --you-soft:#f8e1e9; --both:#6d4fb3; --both-soft:#ece6f8;
  --anniv:#d9900f; --anniv-soft:#fbefd6; --free:#2f9e44; --danger:#c92a2a;
  --apple-bg:#000; --apple-fg:#fff; --google-bg:#fff; --google-fg:#1f1f1f; --google-line:#747775;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  --sal:var(--safe-area-inset-left,env(safe-area-inset-left,0px)); --sar:var(--safe-area-inset-right,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b2029; --fg:#e8ebf2; --muted:#9aa3b5; --line:#2b3240;
  --me:#4fb3c6; --me-soft:#173a42; --you:#e9779c; --you-soft:#45202e; --both:#a78bea; --both-soft:#2e2647;
  --anniv:#f0b545; --anniv-soft:#3d2f14; --free:#5cc46f; --danger:#ff6b6b;
  --apple-bg:#fff; --apple-fg:#000; --google-bg:#131314; --google-fg:#e3e3e3; --google-line:#8e918f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b2029; --fg:#e8ebf2; --muted:#9aa3b5; --line:#2b3240;
  --me:#4fb3c6; --me-soft:#173a42; --you:#e9779c; --you-soft:#45202e; --both:#a78bea; --both-soft:#2e2647;
  --anniv:#f0b545; --anniv-soft:#3d2f14; --free:#5cc46f; --danger:#ff6b6b;
  --apple-bg:#fff; --apple-fg:#000; --google-bg:#131314; --google-fg:#e3e3e3; --google-line:#8e918f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));padding-block:20px}
.app{max-width:400px;margin:0 auto;background:var(--surface);border-radius:28px;border:1px solid var(--line);
  overflow:hidden;display:flex;flex-direction:column;min-height:720px}
@media (max-width:500px){ body{padding:0} .app{max-width:none;min-height:100%;border:0;border-radius:0} }
#shell{flex:1;display:flex;flex-direction:column}
header{padding:calc(16px + var(--sat)) max(20px,var(--sar)) 8px max(20px,var(--sal));display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.pair{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.av.me{background:var(--me)} .av.you{background:var(--you);margin-left:-10px;border:2px solid var(--surface)}
main{flex:1;padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav button{background:none;border:0;padding:12px 0 14px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button[aria-current="true"]{color:var(--fg);font-weight:700}
nav svg{width:22px;height:22px}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within,a:focus-visible{outline:2px solid var(--both);outline-offset:2px}
a{color:var(--both)}
input[type=text],input[type=search],input[type=date],input[type=time],select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input[type=checkbox]{accent-color:var(--both);width:20px;height:20px;margin:0}
.muted{color:var(--muted)}

/* 로그인 */
#login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:calc(32px + var(--sat)) 28px calc(28px + var(--sab))}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.brand .mark{display:flex}
.brand .av{width:56px;height:56px;font-size:22px}
.brand .av.you{margin-left:-16px;border-width:3px}
.brand h1{font-size:34px}
.brand p{margin:0;color:var(--muted);line-height:1.6}
.sso{display:flex;flex-direction:column;gap:10px}
.sso button{height:50px;border-radius:12px;font:inherit;font-size:16px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;border:0}
.sso svg{width:20px;height:20px;flex:none}
.apple{background:var(--apple-bg);color:var(--apple-fg)}
.kakao{background:#FEE500;color:rgba(0,0,0,.85)}
.google{background:var(--google-bg);color:var(--google-fg);border:1px solid var(--google-line)!important}
.fine{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;margin:0}
.demo{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:12px;padding:12px;font:inherit;font-size:13px;cursor:pointer}

/* 위젯 카드 */
.widget{background:var(--bg);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.widget h2{grid-column:1/-1;font-family:var(--display);font-weight:400;font-size:18px;margin:0}
.widget .wph{grid-row:2/span 3;width:64px;height:64px;object-fit:cover;border-radius:12px}
.wrow{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.wrow time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.wrow b{color:var(--anniv)}
.wrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.month{display:flex;justify-content:space-between;align-items:center}
.month b{font-family:var(--display);font-weight:400;font-size:22px}
.month button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wd{font-size:11px;color:var(--muted);padding:4px 0;letter-spacing:.04em}
.wd:first-child{color:var(--you)}
.day{background:none;border:0;color:var(--fg);font:inherit;font-size:14px;aspect-ratio:1/1.1;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 0;gap:3px;font-variant-numeric:tabular-nums;position:relative}
.day.out{visibility:hidden}
.day.sel{background:var(--both-soft)}
.day.today span:first-child{background:var(--fg);color:var(--surface);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.day.free::after{content:"";position:absolute;inset:3px;border:1.5px dashed var(--free);border-radius:10px;pointer-events:none}
.dots{display:flex;gap:3px;height:8px}
.day .pth{width:16px;height:16px;object-fit:cover;border-radius:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend .fb{width:12px;height:12px;border:1.5px dashed var(--free);border-radius:4px}
.list{display:flex;flex-direction:column;gap:8px}
.list h2,.sec h2{font-size:14px;margin:4px 0 0;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.small{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.ev{display:grid;grid-template-columns:52px 1fr auto auto;gap:8px;align-items:center;padding:10px 12px;border-radius:14px}
.ev.me{background:var(--me-soft)} .ev.you{background:var(--you-soft)} .ev.both{background:var(--both-soft)} .ev.anniv{background:var(--anniv-soft)}
.ev time,.ev .dd{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.ev .dd{color:var(--anniv);font-weight:700}
.ev .who{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff}
.who.me{background:var(--me)} .who.you{background:var(--you)} .who.both{background:var(--both)} .who.anniv{background:var(--anniv)}
.ev span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:4px;width:28px}
.empty{color:var(--muted);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.form{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px}
.row{display:flex;gap:8px} .row>*{flex:1;min-width:0}
.photo{position:relative;border-radius:16px;overflow:hidden}
.photo img{display:block;width:100%;max-height:260px;object-fit:cover}
.photo .x{position:absolute;top:8px;right:8px;background:var(--fg);color:var(--surface);border-radius:50%;width:30px;height:30px}

.seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font:inherit;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700}
.drop{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--muted)}
.drop strong{color:var(--fg)}
.drop img{border-radius:12px;max-height:200px;max-width:100%;object-fit:contain}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick label,.filebtn{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-size:14px;display:block}
.pick input,.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.sample{background:none;border:0;color:var(--both);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;align-self:center}
.cta{background:var(--fg);color:var(--surface);border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;cursor:pointer}
.cta:disabled{opacity:.4;cursor:default}
.ghost{background:none;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;cursor:pointer}
.danger{background:none;border:0;color:var(--danger);font:inherit;font-size:14px;cursor:pointer;padding:8px;text-decoration:underline}
.danger.solid{background:var(--danger);color:#fff;text-decoration:none;border-radius:14px;padding:12px;font-weight:700}
.parsed{display:flex;flex-direction:column;gap:6px}
.parsed label,.sw{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px}
.sw{grid-template-columns:1fr auto;cursor:pointer}
.parsed small,.sw small{display:block;color:var(--muted);font-size:12px}
.note{font-size:12px;color:var(--muted);line-height:1.6;background:var(--bg);border-radius:12px;padding:10px 12px;margin:0}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--both);border-radius:50%;animation:s .8s linear infinite;margin:auto}
@keyframes s{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:5}

.card{border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card>b{font-size:15px}
.code{font-family:var(--display);font-size:34px;letter-spacing:.18em;text-align:center}
.status{display:flex;align-items:center;gap:10px}
.status .av{width:40px;height:40px;font-size:15px;margin:0;border:0}
.links{display:flex;gap:16px;justify-content:center;font-size:13px}
.big{font-family:var(--display);font-size:40px;text-align:center;color:var(--you);line-height:1}

/* 커뮤니티 */
textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:96px;resize:vertical}
.post{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.post p{margin:0;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.ph{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.ph b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph time{color:var(--muted);font-size:12px;margin-left:auto;flex:none}
.ph .av{width:26px;height:26px;margin:0;border:0;flex:none}
.av.o{background:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;flex:none}
.tag.daily{background:var(--me-soft);color:var(--me)} .tag.qna{background:var(--anniv-soft);color:var(--anniv)} .tag.talk{background:var(--both-soft);color:var(--both)}
.pimg{width:100%;max-height:300px;object-fit:cover;border-radius:12px}
.acts{display:flex;gap:6px;align-items:center}
.small[aria-pressed="true"]{color:var(--you);border-color:var(--you)}
.menu{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.menu button{font-size:13px;padding:4px 8px}
.cm{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.cmt{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;font-size:14px}
.cmt b{font-size:12px;display:block} .cmt span{overflow-wrap:anywhere}
.cmt .av{width:22px;height:22px;font-size:10px;margin:0;border:0}
.cmt .x{font-size:12px;width:auto;text-decoration:underline}
.rules{margin:0;padding-left:18px;line-height:1.8;font-size:14px}
.ev.edit{cursor:pointer;text-align:left;font:inherit;color:inherit;border:0;width:100%}
.ev small{display:block;font-size:12px;color:var(--muted)}
.inline{display:flex;align-items:center;gap:8px;font-size:14px}
.loading{flex:1;display:grid;place-items:center}
#nick{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:calc(32px + var(--sat)) 28px calc(28px + var(--sab))}
#nick h1{font-size:28px}
</style>

<div class="app">
  <section id="login" aria-label="로그인">
    <div class="brand">
      <div class="mark"><span class="av me">나</span><span class="av you">너</span></div>
      <h1>우리 캘린더</h1>
      <p>일정표 사진 한 장이면<br>둘의 일정이 한 달력에 모여요.</p>
    </div>
    <div class="sso">
      <button class="apple" data-login="apple"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 1.43c0 1.14-.5 2.27-1.18 3.08-.74.9-1.99 1.57-2.99 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.57-2.27 1.21-2.98.8-.94 2.14-1.64 3.25-1.68.03.13.05.28.05.43zm4.56 15.71c-.03.07-.46 1.58-1.52 3.12-.94 1.34-1.94 2.71-3.43 2.71-1.52 0-1.9-.88-3.63-.88-1.7 0-2.3.91-3.67.91-1.38 0-2.33-1.26-3.43-2.8C4.04 18.38 3 15.57 3 12.92c0-4.28 2.8-6.55 5.55-6.55 1.45 0 2.68.95 3.6.95.87 0 2.22-1.01 3.9-1.01.62 0 2.89.06 4.38 2.19-.13.09-2.39 1.37-2.39 4.19 0 3.26 2.86 4.42 2.96 4.45z"/></svg>Apple로 계속하기</button>
      <button class="kakao" data-login="kakao"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 3C6.48 3 2 6.48 2 10.8c0 2.78 1.86 5.22 4.66 6.6l-.95 3.48c-.08.3.26.54.52.37l4.13-2.74c.54.06 1.08.09 1.64.09 5.52 0 10-3.48 10-7.8S17.52 3 12 3z"/></svg>카카오로 계속하기</button>
      <button class="google" data-login="google"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.87 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.96 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/></svg>Google로 계속하기</button>
    </div>
    <p class="fine">계속하면 <a href="terms.html" data-ext>이용약관</a>과 <a href="privacy.html" data-ext>개인정보처리방침</a>에 동의하는 것으로 봐요.</p>
    <button class="demo" id="demo" hidden>설정 전이라 로그인이 꺼져 있어요 · 데모로 둘러보기</button>
  </section>

  <section id="nick" aria-label="닉네임 정하기" hidden>
    <h1>반가워요!</h1>
    <p class="muted" style="margin:0;line-height:1.6">상대방과 커뮤니티에 보일 닉네임을 정해 주세요.<br>실명 대신 별명을 쓰는 걸 추천해요.</p>
    <form class="form" id="nickForm" style="border:0;padding:0">
      <input type="text" id="nickIn" placeholder="2~12자" minlength="2" maxlength="12" required autocomplete="off" aria-label="닉네임">
      <button type="submit" class="cta">시작하기</button>
    </form>
  </section>

  <div id="shell" hidden>
    <header>
      <h1>우리 캘린더</h1>
      <div class="pair"><span class="av me" id="avMe"></span><span class="av you" id="avYou"></span><span id="dplus"></span></div>
    </header>
    <main id="view"></main>
    <nav>
      <button data-tab="cal" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>캘린더</button>
      <button data-tab="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>사진으로 추가</button>
      <button data-tab="anniv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>기념일</button>
      <button data-tab="comm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M17 9h3a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v3l-4-3h-3"/></svg>커뮤니티</button>
      <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>

<script src="vendor/capacitor.js"></script>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const C = window.APP_CONFIG;
const configured = !C.SUPABASE_URL.includes("YOUR-");
const native = Capacitor.isNativePlatform(), android = Capacitor.getPlatform() === "android";
const reg = n => Capacitor.registerPlugin(n);
const P = native ? { App:reg("App"), Browser:reg("Browser"), Notes:reg("LocalNotifications"), Widget:reg("WidgetBridge") } : {};
const sb = configured ? supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth:{ flowType:"pkce", detectSessionInUrl:!native } }) : null;

let user = null, S = null;                       // S = 저장소 (store.js: makeLocal / makeCloud)
const L = readLocal();                           // 이 기기 설정·데모 데이터 (cc.v1)
const persist = () => { const ok = writeLocal(L); if(!ok) toast("저장 공간이 부족해요. 오래된 사진을 지워 주세요."); return ok; };
let db = { events:[], annivs:[], photos:{}, start:"", couple:{}, me:{} };   // 화면에 보이는 데이터
const NAME = {me:"나", you:"상대방", both:"함께", anniv:"기념일"};

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2,"0");
const key = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const toD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const iso = dt => key(dt.getFullYear(), dt.getMonth(), dt.getDate());
const days = (a,b) => Math.round((toD(b) - toD(a)) / 864e5);
const addDays = (s,n) => { const t = toD(s); t.setDate(t.getDate()+n); return iso(t); };
const kdate = s => `${+s.slice(5,7)}월 ${+s.slice(8,10)}일`;
const wday = s => "일월화수목금토"[toD(s).getDay()];
const dlabel = n => n===0 ? "D-Day" : n>0 ? `D-${n}` : `D+${-n}`;
const TODAY = iso(new Date());
let ym = [+TODAY.slice(0,4), +TODAY.slice(5,7)-1], sel = TODAY, filter = "all", tab = "cal";
let form = null, confirmDelete = false, confirmLeave = false, up = {img:null, state:"idle", rows:[], sample:false};

// 사진 분석 예시 (데모·서버 설정 전)
const SAMPLE_PARSE = [{d:addDays(TODAY,3),t:"10:00",title:"분기 보고"},{d:addDays(TODAY,5),t:"",title:"야간 근무"},{d:addDays(TODAY,12),t:"09:30",title:"외근"}];

const $ = s => document.querySelector(s);
const visible = e => filter==="all" || e.who===filter || e.who==="both";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byTime = (a,b) => (a.t||"").localeCompare(b.t||"");
const REP = {none:"반복 안 함", weekly:"매주", monthly:"매달", yearly:"매년"};

/* ---------- 일정 반복·여러 날 ---------- */
// 날짜 k 에 일정 e 가 걸리는지: 시작일(반복이면 각 반복 시작일)부터 기간(end_d-d)만큼
function on(e, k){
  if(k < e.d) return false;
  const span = e.end_d ? days(e.d, e.end_d) : 0;
  if(!e.rep || e.rep==="none") return k <= (e.end_d || e.d);
  for(let o=0; o<=span; o++){
    const s = addDays(k,-o); if(s < e.d) break;
    if(e.rep==="weekly" ? days(e.d,s)%7===0 : e.rep==="monthly" ? s.slice(8)===e.d.slice(8) : s.slice(5)===e.d.slice(5)) return true;
  }
  return false;
}
const eventsOn = (k, all) => db.events.filter(e => on(e,k) && (all || visible(e))).sort(byTime);
// 다음 60일 안에서 둘 다 일정 없는 첫 주말
function freeWeekend(){
  for(let i=1;i<=60;i++){ const k = addDays(TODAY,i), w = toD(k).getDay(); if((w===0||w===6) && !eventsOn(k,true).length && !annivOn(k).length) return k; }
  return null;
}

/* ---------- 기념일 ---------- */
function upcoming(){
  const list = db.annivs.map(a => {
    let n = a.d;
    if(a.yearly){ n = TODAY.slice(0,4) + a.d.slice(4); if(n < TODAY) n = (+TODAY.slice(0,4)+1) + a.d.slice(4); }
    return {...a, next:n, dday:days(TODAY,n)};
  });
  if(db.start){
    for(let k=100; k<=1000; k+=100){ const n = addDays(db.start, k-1); if(n >= TODAY) list.push({id:"auto"+k, name:`${k}일`, next:n, dday:days(TODAY,n), auto:true}); }
    for(let y=1; y<=60; y++){ const n = (+db.start.slice(0,4)+y) + db.start.slice(4); if(n >= TODAY){ list.push({id:"autoy"+y, name:`${y}주년`, next:n, dday:days(TODAY,n), auto:true}); if(y>=3 && list.filter(x=>x.auto).length>=5) break; } }
  }
  return list.filter(a => a.dday >= 0).sort((a,b) => a.dday - b.dday);
}
const annivOn = d => upcoming().filter(a => a.next === d);

/* ---------- 공통 ---------- */
const ERR = { code_not_found:"코드를 찾을 수 없어요. 다시 확인해 주세요.", own_code:"내 코드예요. 상대의 코드를 입력해 주세요.", couple_full:"이미 두 사람이 연결된 코드예요.", already_linked:"이미 연결돼 있어요. 다른 사람과 연결하려면 먼저 연결을 끊어 주세요.",
  nickname_taken:"이미 쓰는 닉네임이에요.", needs_login:"로그인 설정 후 쓸 수 있어요.", full:"저장 공간이 부족해요. 오래된 사진을 지워 주세요.", not_linked:"연결된 상대가 없어요." };
const errMsg = e => ERR[Object.keys(ERR).find(k => String(e?.message).includes(k))] || "처리하지 못했어요. 네트워크를 확인하고 다시 시도해 주세요.";
async function act(fn, done){ try{ await fn(); if(done) toast(done); return true; }catch(e){ console.warn(e); toast(errMsg(e)); return false; } }
// 스토어 UGC 규정: 부적절한 표현 거르기. ponytail: 단순 금칙어 목록, 서버 필터·관리자 검토로 키울 것.
const BAD = ["씨발","시발","ㅅㅂ","병신","ㅂㅅ","개새끼","좆","fuck","shit"];
const clean = s => !BAD.some(w => s.toLowerCase().replace(/\s/g,"").includes(w));
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=t; document.body.append(el); setTimeout(()=>el.remove(),2600); }
function shrink(file, max=900){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL("image/jpeg", .82));
    };
    img.onerror = () => rej(new Error("image"));
    img.src = URL.createObjectURL(file);
  });
}
function applyLook(){
  const s = L.settings, r = document.documentElement;
  s.theme==="system" ? r.removeAttribute("data-theme") : r.setAttribute("data-theme", s.theme);
  r.style.zoom = s.zoom;
}

/* ---------- 로그인 ---------- */
async function login(provider){
  if(!sb) return toast("로그인 설정이 아직 안 됐어요 (docs/config.js)");
  const redirectTo = native ? C.NATIVE_REDIRECT : location.origin + location.pathname;
  const { data, error } = await sb.auth.signInWithOAuth({ provider, options: { redirectTo, skipBrowserRedirect: native } });
  if(error) return toast("로그인을 시작하지 못했어요. 잠시 후 다시 시도해 주세요.");
  if(native) await P.Browser.open({ url: data.url });   // 시스템 브라우저로 (Google·Apple 정책)
}
if(native){
  P.App.addListener("appUrlOpen", async ({ url }) => {
    if(!url.startsWith(C.NATIVE_REDIRECT)) return;
    const q = new URL(url).searchParams;
    P.Browser.close().catch(()=>{});
    if(q.get("code")){ const { error } = await sb.auth.exchangeCodeForSession(q.get("code")); if(error) toast("로그인을 마치지 못했어요. 다시 시도해 주세요."); }
    else if(q.get("error")) toast("로그인이 취소됐어요.");
  });
}
function show(which){ $("#login").hidden = which!=="login"; $("#nick").hidden = which!=="nick"; $("#shell").hidden = which!=="shell"; }
async function setUser(u){
  S?.stop?.(); user = u; form = null; confirmDelete = confirmLeave = false;
  if(!u){ S = null; show("login"); return; }
  S = u.demo ? makeLocal(L, persist, true) : makeCloud(sb, u, () => refresh().catch(()=>{}));
  if(u.demo) seedDemo();
  show("shell"); $("#view").innerHTML = `<div class="loading"><div class="spin" role="status" aria-label="불러오는 중"></div></div>`;
  if(!await act(refresh)) return;
  if(!db.me.nickname){ show("nick"); $("#nickIn").focus(); }
}
async function refresh(){
  Object.assign(db, await S.load());
  NAME.me = db.me.nickname || "나"; NAME.you = db.couple.partner || "상대방";
  $("#avMe").textContent = NAME.me[0]; $("#avYou").textContent = NAME.you[0]; $("#avYou").hidden = !db.couple.linked;
  render(); background();
}
function seedDemo(){
  if(L.demoSeeded) return;
  L.events.push({id:newId(), d:addDays(TODAY,2), t:"13:00", title:"수업 보강", who:"you"}, {id:newId(), d:addDays(TODAY,6), t:"", title:"가족 모임", who:"you"},
                {id:newId(), d:addDays(TODAY,9), t:"19:00", title:"저녁 데이트", who:"both"});
  L.demoSeeded = true; persist();
}
async function logout(){ if(sb && !user.demo) await sb.auth.signOut({ scope:"local" }); tab="cal"; setUser(null); }
async function deleteAccount(){
  const ok = await act(async () => { await S.deleteAccount(); if(!user.demo) await sb.auth.signOut({ scope:"local" }).catch(()=>{}); });
  if(!ok) return;
  try{ localStorage.removeItem(LKEY); }catch{}
  delete L.demoSeeded; Object.assign(L, structuredClone(LDEF)); applyLook(); tab = "cal"; setUser(null); toast("탈퇴가 완료됐어요. 모든 데이터를 지웠어요.");
}
function openExt(href){ const url = new URL(href, C.SITE_URL).href; native ? P.Browser.open({ url }) : window.open(url, "_blank", "noopener"); }

/* ---------- 알림 · 홈 화면 위젯 (휴대폰 앱에서만) ---------- */
let bgTimer;
function background(){ clearTimeout(bgTimer); bgTimer = setTimeout(() => { scheduleNotes(); pushWidget(); }, 500); }
async function scheduleNotes(){
  if(!native) return;
  const s = L.settings, N = P.Notes;
  try{
    const { notifications:pend } = await N.getPending();
    if(pend.length) await N.cancel({ notifications: pend.map(n => ({ id:n.id })) });
    const list = [], now = new Date();
    if(s.nAnniv) upcoming().filter(a => a.dday >= 1).slice(0,20).forEach((a,i) => {
      const at = toD(addDays(a.next,-1)); at.setHours(9);
      if(at > now) list.push({ id:1+i, title:"내일은 기념일이에요", body:`${kdate(a.next)} · ${a.name}`, schedule:{ at, allowWhileIdle:true } });
    });
    if(s.nDaily) for(let i=0;i<7;i++){
      const k = addDays(TODAY,i), es = eventsOn(k,true), at = toD(k); at.setHours(8);
      if(es.length && at > now) list.push({ id:100+i, title:`${kdate(k)} 우리 일정`, body: es.map(e => `${e.t||"종일"} ${e.title}`).join(" · ").slice(0,140), schedule:{ at, allowWhileIdle:true } });
    }
    if(list.length) await N.schedule({ notifications:list });
  }catch(e){ console.warn("notifications", e); }
}
function pushWidget(){
  if(!android) return;
  const s = L.settings, next = upcoming()[0];
  P.Widget.update({ data: JSON.stringify({
    date: TODAY, title: `오늘 · ${kdate(TODAY)}`,
    today: s.wToday ? eventsOn(TODAY,true).slice(0,4).map(e => `${e.t||"종일"}  ${e.title}`) : null,
    anniv: s.wAnniv && next ? `${dlabel(next.dday)} ${next.name}` : "",
  }) }).catch(e => console.warn("widget", e));
}

/* ---------- 화면: 캘린더 ---------- */
function widget(){
  const s = L.settings; if(!s.wToday && !s.wAnniv && !s.wPhoto) return "";
  const todays = eventsOn(TODAY,true), next = upcoming()[0], ph = s.wPhoto && db.photos[TODAY], fw = s.wToday && freeWeekend();
  return `<section class="widget" aria-label="오늘 요약"><h2>오늘 · ${kdate(TODAY)}</h2>
    ${ph ? `<img class="wph" src="${ph}" alt="오늘의 우리">` : ""}
    ${s.wToday ? (todays.length ? todays.slice(0,3).map(e => `<div class="wrow"><i class="dot" style="background:var(--${e.who})"></i><time>${e.t||"종일"}</time><span>${esc(e.title)}</span></div>`).join("") + (todays.length>3 ? `<div class="wrow muted">+${todays.length-3}개</div>` : "") : `<div class="wrow muted">오늘 일정이 없어요</div>`) : ""}
    ${s.wAnniv ? `<div class="wrow">${next ? `<b>${dlabel(next.dday)}</b><span>${esc(next.name)}</span>` : `<span class="muted">기념일을 등록해 보세요</span>`}</div>` : ""}
    ${fw ? `<div class="wrow"><span>💡 ${kdate(fw)}(${wday(fw)})은 둘 다 비어요. 데이트 어때요?</span></div>` : ""}
  </section>`;
}
function evForm(){
  const f = form;
  return `<form class="form" id="evForm">
    <input type="text" id="evTitle" placeholder="무슨 일정인가요?" required maxlength="60" autocomplete="off" value="${esc(f.title)}">
    <div class="row"><input type="time" id="evTime" value="${f.t || "09:00"}" ${f.allDay?"disabled":""} aria-label="시간">
      <label class="inline"><input type="checkbox" id="evAllDay" ${f.allDay?"checked":""}>하루 종일</label></div>
    <div class="row"><label class="inline" style="flex:none">끝나는 날</label><input type="date" id="evEnd" value="${f.end_d||""}" min="${f.d}" aria-label="끝나는 날 (여러 날 일정)"></div>
    <select id="evRep" aria-label="반복">${Object.entries(REP).map(([v,l]) => `<option value="${v}" ${f.rep===v?"selected":""}>${l}</option>`).join("")}</select>
    <div class="seg" style="grid-template-columns:1fr 1fr">${[[false,NAME.me],[true,"함께"]].map(([v,l]) => `<button type="button" data-shared="${v}" aria-pressed="${f.shared===v}">${esc(l)}</button>`).join("")}</div>
    ${f.id && f.rep!=="none" ? `<p class="note">반복 일정은 모든 날짜에 함께 바뀌어요.</p>` : ""}
    <div class="row"><button type="button" class="ghost" id="evCancel">취소</button>${f.id ? `<button type="button" class="ghost" id="evDel" style="color:var(--danger)">삭제</button>` : ""}<button type="submit" class="cta">저장</button></div></form>`;
}
function cal(){
  const [y,m] = ym, first = new Date(y,m,1).getDay(), daysIn = new Date(y,m+1,0).getDate();
  let cells = "";
  for(let i=0;i<first;i++) cells += `<span class="day out"></span>`;
  for(let d=1; d<=daysIn; d++){
    const k = key(y,m,d), es = eventsOn(k);
    const whos = [...new Set(es.map(e => e.who))]; if(annivOn(k).length) whos.push("anniv");
    const free = !eventsOn(k,true).length;
    cells += `<button class="day${k===sel?" sel":""}${k===TODAY?" today":""}${free?" free":""}" data-d="${k}" aria-label="${m+1}월 ${d}일 일정 ${es.length}개">
      <span>${d}</span><span class="dots">${whos.map(w => `<i class="dot" style="background:var(--${w})"></i>`).join("")}</span>${db.photos[k] ? `<img class="pth" src="${db.photos[k]}" alt="">` : ""}</button>`;
  }
  const list = eventsOn(sel), an = annivOn(sel), ph = db.photos[sel];
  const sub = e => [e.end_d ? `~${kdate(e.end_d)}` : "", e.rep && e.rep!=="none" ? REP[e.rep] : ""].filter(Boolean).join(" · ");
  $("#view").innerHTML = widget() + `
    <div class="month"><button data-mv="-1" aria-label="이전 달">‹</button><b>${y}년 ${m+1}월</b><button data-mv="1" aria-label="다음 달">›</button></div>
    <div class="chips">${[["all","모두"],["me",NAME.me],["you",NAME.you]].map(([v,l]) =>
      `<button class="chip" data-f="${v}" aria-pressed="${filter===v}">${v!=="all"?`<i class="dot" style="background:var(--${v})"></i>`:""}${esc(l)}</button>`).join("")}</div>
    <div class="grid">${"일월화수목금토".split("").map(w => `<span class="wd">${w}</span>`).join("")}${cells}</div>
    <div class="legend"><span><i class="dot" style="background:var(--me)"></i>${esc(NAME.me)}</span><span><i class="dot" style="background:var(--you)"></i>${esc(NAME.you)}</span><span><i class="dot" style="background:var(--both)"></i>함께</span><span><i class="dot" style="background:var(--anniv)"></i>기념일</span><span><i class="fb"></i>둘 다 비는 날</span></div>
    <div class="list"><h2>${kdate(sel)}${sel===TODAY?" · 오늘":""}<button class="small" id="addEv">+ 일정</button></h2>
      ${form ? evForm() : ""}
      ${an.map(a => `<div class="ev anniv"><span class="dd">${dlabel(a.dday)}</span><span>${esc(a.name)}</span><span class="who anniv">기념일</span><span></span></div>`).join("")}
      ${list.map(e => `<${e.mine?`button class="ev ${e.who} edit" data-edit="${e.id}" aria-label="${esc(e.title)} 수정"`:`div class="ev ${e.who}"`}><time>${e.t||"종일"}</time><span>${esc(e.title)}${sub(e)?`<small>${sub(e)}</small>`:""}</span><span class="who ${e.who}">${esc(NAME[e.who])}</span><span></span></${e.mine?"button":"div"}>`).join("")}
      ${!list.length && !an.length && !form ? `<div class="empty">둘 다 일정이 없어요. 데이트 잡기 좋은 날이에요.</div>` : ""}
    </div>
    <div class="sec list"><h2>오늘의 우리</h2>
      ${ph ? `<div class="photo"><img src="${ph}" alt="${kdate(sel)} 오늘의 우리 사진"><button class="x" id="phDel" aria-label="사진 삭제">×</button></div>`
           : `<label class="filebtn" for="phFile">이 날의 사진 남기기<input type="file" id="phFile" accept="image/*"></label>`}
    </div>`;
}

/* ---------- 화면: 사진으로 추가 (내 일정만) ---------- */
function upload(){
  let body = "";

/* ---------- 이벤트 ---------- */
document.addEventListener("click", async e => {
  const a = e.target.closest("a[data-ext]");
  if(a){ e.preventDefault(); return openExt(a.getAttribute("href")); }
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.login) login(d.login);
  else if(b.id==="demo") setUser({demo:true});
  else if(d.tab) goTab(d.tab);
  // 캘린더
  else if(d.d){ sel=d.d; form=null; cal(); }
  else if(d.mv){ ym[1]+=+d.mv; if(ym[1]<0){ym[0]--;ym[1]=11} if(ym[1]>11){ym[0]++;ym[1]=0} cal(); }
  else if(d.f){ filter=d.f; cal(); }
  else if(b.id==="addEv"){ form = form ? null : {d:sel, t:"09:00", title:"", end_d:"", rep:"none", shared:false, allDay:false}; cal(); form && $("#evTitle").focus(); }
  else if(d.edit){ const x = db.events.find(v => v.id===d.edit); form = {...x, shared:x.who==="both", allDay:!x.t}; cal(); }
  else if(b.id==="evCancel"){ form=null; cal(); }
  else if(d.shared){ form.shared = d.shared==="true"; document.querySelectorAll("[data-shared]").forEach(x => x.setAttribute("aria-pressed", x===b)); }
  else if(b.id==="evDel"){ const id=form.id; form=null; await act(async () => { await S.delEvent(id); await refresh(); }, "일정을 지웠어요"); }
  else if(b.id==="phDel"){ await act(async () => { await S.delPhoto(sel); await refresh(); }, "사진을 지웠어요"); }
  // 사진으로 추가
  else if(b.id==="sample"){ up.img=sampleImg(); up.sample=true; upload(); }
  else if(b.id==="retry"){ up={img:null,state:"idle",rows:[],sample:false}; upload(); }
  else if(b.id==="go"){
    up.state="busy"; upload();
    try{
      const rows = S.cloud ? await S.parse(up.img, TODAY) : null;
      if(!rows) await new Promise(r => setTimeout(r, 1200));
      up.rows = rows || SAMPLE_PARSE.map(r => ({...r})); up.state="done";
    }catch(err){ console.warn(err); up.state="idle"; toast("사진을 읽지 못했어요. 잠시 후 다시 시도해 주세요."); }
    if(tab==="up") upload();
  }
  else if(b.id==="add"){
    const picked = up.rows.filter((r,i) => $("#r"+i).checked);
    const ok = await act(async () => { for(const r of picked) await S.addEvent({ d:r.d, end_d:r.end_d||null, t:r.t||"", title:r.title, rep:"none", shared:false }); await refresh(); }, `${picked.length}개 일정을 추가했어요`);
    if(!ok) return;
    up={img:null,state:"idle",rows:[],sample:false};
    if(picked[0]){ sel=picked[0].d; ym=[+sel.slice(0,4), +sel.slice(5,7)-1]; }
    goTab("cal");
  }
  // 기념일
  else if(d.delan){ await act(async () => { await S.delAnniv(d.delan); await refresh(); }, "기념일을 지웠어요"); }
  // 커뮤니티
  else if(b.id==="agree"){ L.rules=true; persist(); community(); }
  else if(d.cf){ feedOpts.cat = d.cf==="all" ? "" : d.cf; feedOpts.mine=false; reFeed(); }
  else if(b.id==="mine"){ feedOpts.mine=!feedOpts.mine; feedOpts.cat=""; reFeed(); }
  else if(b.id==="more"){ act(() => loadFeed(true)); }
  else if(b.id==="write"){ writing=!writing; community(); if(writing) $("#pText").focus(); }
  else if(d.pcat){ wr.cat=d.pcat; community(); }
  else if(b.id==="pCancel"){ writing=false; wr={cat:"daily",text:"",img:null}; community(); }
  else if(b.id==="pImgDel"){ wr.img=null; community(); }
  else if(d.menu){ menuFor = menuFor===d.menu ? null : d.menu; community(); }
  else if(d.editpost){ editing=d.editpost; menuFor=null; community(); }
  else if(b.id==="editCancel"){ editing=null; community(); }
  else if(d.delpost){ menuFor=null; await act(async () => { await S.delPost(d.delpost); await loadFeed(); }, "글을 지웠어요"); }
  else if(d.report){ const [kind,id] = d.report.split(":"); menuFor=null; L.reported.push(id); persist(); community(); act(() => S.report(kind,id), "신고했어요. 24시간 안에 검토할게요."); }
  else if(d.block){ menuFor=null; await act(async () => { await S.block(d.block); await loadFeed(); }, `${d.bname}님을 차단했어요. 글과 댓글이 더 보이지 않아요.`); }
  else if(d.like){ const p=findPost(d.like); p.liked=!p.liked; p.likes+=p.liked?1:-1; community(); act(() => S.like(p.id, p.liked)); }
  else if(d.open){ openPost = openPost===d.open ? null : d.open; community(); }
  else if(d.delc){ const [pid,cid]=d.delc.split(":"); await act(async () => { await S.delComment(pid,cid); await loadFeed(); }); }
  // 설정
  else if(d.unblock){ await act(async () => { await S.unblock(d.unblock); blockedList = await S.blocked(); feedLoaded=false; settings(); }, "차단을 풀었어요"); }
  else if(d.look){ L.settings[d.look] = d.look==="zoom" ? +d.v : d.v; persist(); applyLook(); settings(); }
  else if(b.id==="copy"){ navigator.clipboard?.writeText(db.couple.code).then(() => toast("복사했어요. 상대에게 보내 주세요."), () => getSelection().selectAllChildren($("#code"))); }
  else if(b.id==="leave"){ confirmLeave=true; settings(); }
  else if(b.id==="leaveNo"){ confirmLeave=false; settings(); }
  else if(b.id==="leaveYes"){ confirmLeave=false; await act(async () => { await S.leave(); await refresh(); }, "연결을 끊었어요"); }
  else if(b.id==="nickEdit"){ nickEdit=true; settings(); $("#nickIn2").focus(); }
  else if(b.id==="logout") logout();
  else if(b.id==="del"){ confirmDelete=true; settings(); }
  else if(b.id==="delNo"){ confirmDelete=false; settings(); }
  else if(b.id==="delYes") deleteAccount();
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if(f.id==="evForm"){
    const allDay = $("#evAllDay").checked, end = $("#evEnd").value;
    const ev = { d:form.d, end_d: end && end > form.d ? end : null, t: allDay ? "" : $("#evTime").value, title:$("#evTitle").value.trim(), rep:$("#evRep").value, shared:form.shared };
    if(!ev.title) return;
    const id = form.id;
    if(await act(async () => { id ? await S.updateEvent(id, ev) : await S.addEvent(ev); form=null; await refresh(); }, id ? "일정을 고쳤어요" : "일정을 추가했어요")) return;
  }
  if(f.id==="anForm"){
    const a = { name:$("#anName").value.trim(), d:$("#anDate").value, yearly:$("#anYearly").checked };
    await act(async () => { await S.addAnniv(a); await refresh(); }, "기념일을 추가했어요");
  }
  if(f.id==="nickForm" || f.id==="nickForm2"){
    const n = (f.id==="nickForm" ? $("#nickIn") : $("#nickIn2")).value.trim();
    if(!nickOk(n)) return;
    if(await act(async () => { await S.setNickname(n); await refresh(); }, "닉네임을 정했어요")){ nickEdit=false; show("shell"); render(); }
  }
  if(f.id==="joinForm"){
    const code = $("#joinCode").value.trim();
    await act(async () => { await S.join(code); await refresh(); }, "연결됐어요! 이제 둘의 일정이 한 달력에 보여요.");
  }
  if(f.id==="postForm"){
    const text = $("#pText").value.trim();
    if(!text) return;
    if(!clean(text)) return toast("규칙에 맞지 않는 표현이 있어요. 고쳐서 다시 올려 주세요.");
    await act(async () => { await S.addPost({ cat:wr.cat, text, img:wr.img }); writing=false; wr={cat:"daily",text:"",img:null}; feedOpts={cat:"",q:"",mine:false}; await loadFeed(); }, "글을 올렸어요");
  }
  if(f.dataset.editform){
    const text = f.t.value.trim();
    if(!text) return;
    if(!clean(text)) return toast("규칙에 맞지 않는 표현이 있어요. 고쳐서 다시 올려 주세요.");
    await act(async () => { await S.editPost(f.dataset.editform, text); editing=null; await loadFeed(); }, "글을 고쳤어요");
  }
  if(f.dataset.cpost){
    const text = f.c.value.trim();
    if(!text) return;
    if(!clean(text)) return toast("규칙에 맞지 않는 표현이 있어요. 고쳐서 다시 올려 주세요.");
    await act(async () => { await S.addComment(f.dataset.cpost, text); await loadFeed(); });
  }
});
let qTimer;
document.addEventListener("input", e => {
  if(e.target.id==="pText") wr.text = e.target.value;
  if(e.target.id==="q"){ clearTimeout(qTimer); qTimer = setTimeout(() => { feedOpts.q = e.target.value.trim(); act(() => loadFeed()).then(() => { const q=$("#q"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }); }, 400); }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if(["file","cam"].includes(t.id) && t.files[0]){ up.img = await shrink(t.files[0], 1600); up.state="idle"; up.sample=false; upload(); }
  else if(t.id==="phFile" && t.files[0]){ const img = await shrink(t.files[0]); await act(async () => { await S.setPhoto(sel, img); await refresh(); }, "오늘의 우리 사진을 남겼어요"); }
  else if(t.id==="pImg" && t.files[0]){ wr.img = await shrink(t.files[0]); community(); }
  else if(t.id==="evAllDay"){ form.allDay = t.checked; $("#evTime").disabled = t.checked; }
  else if(t.id==="start"){ const v = t.value; await act(async () => { await S.setStart(v); await refresh(); }); }
  else if(t.dataset.set){
    const k = t.dataset.set;
    if(t.checked && (k==="nAnniv" || k==="nDaily")){
      const r = await P.Notes.requestPermissions().catch(() => ({}));
      if(r.display !== "granted"){ t.checked = false; return toast("휴대폰 설정에서 알림을 허용해 주세요."); }
    }
    L.settings[k] = t.checked; persist(); background();
  }
});

// 예시용 '일정표 사진'을 캔버스로 그림
function sampleImg(){
  const c=document.createElement("canvas"); c.width=600; c.height=380; const x=c.getContext("2d");
  x.fillStyle="#fbfbf7"; x.fillRect(0,0,600,380); x.fillStyle="#222"; x.font="bold 26px sans-serif"; x.fillText(`${+TODAY.slice(5,7)}월 일정표`,24,44);
  x.strokeStyle="#bbb"; x.font="20px sans-serif";
  SAMPLE_PARSE.forEach((r,i) => { const yy=100+i*80; x.strokeRect(24,yy-34,552,60);
    x.fillText(r.d.slice(5).replace("-","/"),40,yy+4); x.fillText(r.t||"종일",150,yy+4); x.fillText(r.title,260,yy+4); });
  return c.toDataURL("image/jpeg", .9);
}

applyLook();
let authUid;
if(sb) sb.auth.onAuthStateChange((ev, session) => {
  // Apple 로그인 직후에만 오는 토큰을 저장해 두었다가 탈퇴할 때 철회 (앱스토어 5.1.1(v))
  if(ev==="SIGNED_IN" && session?.provider_refresh_token && session.user.app_metadata?.provider==="apple")
    sb.rpc("save_apple_token", { p_token: session.provider_refresh_token }).then(({error}) => error && console.warn(error));
  // 같은 사람의 SIGNED_IN·INITIAL_SESSION 이 연달아 와도 한 번만 처리 (setUser 는 콜백 밖에서 실행: supabase-js 권장)
  const uid = session?.user?.id ?? null;
  if(uid !== authUid){ authUid = uid; setTimeout(() => setUser(session?.user ?? null)); }
});
else { $("#demo").hidden = false; setUser(null); }
